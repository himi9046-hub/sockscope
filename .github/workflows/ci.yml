name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-tools-common "linux-tools-$(uname -r)"
      - run: go generate ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o sockscope-collector .

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew test installDist --console=plain
