name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-tools-generic fakeroot
      - run: echo "BPFTOOL=$(ls /usr/lib/linux-tools/*/bpftool | head -1)" >> "$GITHUB_ENV"
      - working-directory: collector
        run: |
          go generate ./...
          go test ./...
          go build -trimpath -o sockscope-collector .
      - run: packaging/build.sh "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "sockscope $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
